syntax = "proto3";

package projectpb;

message Project {
  string id = 1;
  string userId = 2;
  string title = 3;
  string status = 4;
  ProjectSetting setting = 5;
}

message ProjectSetting {
  string domain = 1;
}

message ProjectCampaign {
  string id = 1;
  string campaignType = 2;
  string status = 3;
}

message ProjectCollaborator {
  string id = 1;
  Collaborator user = 2;
  string role = 3;
}

message Collaborator {
  string id = 1;
  string name = 2;
  string email = 3;
}