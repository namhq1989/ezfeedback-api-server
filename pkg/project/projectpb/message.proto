syntax = "proto3";

package projectpb;

message Project {
  string id = 1;
  string title = 2;
  string status = 3;
  ProjectSetting setting = 4;
}

message ProjectSetting {
  string domain = 1;
}

message ProjectCampaign {
  string id = 1;
  string campaignType = 2;
  string status = 3;
}

message ProjectCollaborator {
  string id = 1;
  string userId = 2;
  string role = 3;
}
