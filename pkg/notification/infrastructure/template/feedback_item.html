<div style="background-color: oklch(94.19% 0.0079 264.52); border-radius: 0.75rem; padding: 12px; margin-bottom: 10px;">
    <!-- Header section with feedback type, project name, and email -->
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
        <!-- Left section: Feedback type and project name -->
        <div style="flex: 1;">
            <div style="font-size: 13px; margin-bottom: 5px;">
        <span style="display: inline-block; background-color: {{typeBadgeColor}}; color: {{typeBadgeTextColor}}; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500; margin-right: 6px;">
          {{feedbackType}}
        </span>
                <span style="font-weight: 600; color: oklch(43.12% 0.0426 279.51);">{{projectName}}</span>
            </div>
        </div>
        <!-- Right section: Email -->
        <div>
            <div style="font-size: 13px; text-align: right;">
                {{userIdentification}}
            </div>
        </div>
    </div>

    <!-- Date and rating section -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <!-- Left: Creation date -->
        <div style="font-size: 11px;">
            <span style="color: oklch(40.62% 0.0221 264.29);">{{createdAt}}</span>
        </div>
        <!-- Right: Rating -->
        <div style="font-size: 11px; color: oklch(40.62% 0.0221 264.29);">
            {{rating}} / {{maxRating}}
        </div>
    </div>

    <!-- Content section -->
    {{#if hasContent}}
    <div style="color: oklch(38.87% 0.0375 279.56); font-size: 13px; line-height: 1.4;">
        {{content}}
    </div>
    {{/if}}
</div>
